services:
  timebookingapp-postgres: 
    image: postgres:18.4-bookworm
    container_name: timebookingapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: always

  timebookingapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes: 
      - ${PROJECT_ROOT}/migrations:/migrations
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
